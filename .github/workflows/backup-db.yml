name: Backup Diario Cifrado — PostgreSQL & Storage (RPO 24h)

on:
  schedule:
    # Todos los días a las 06:00 UTC (03:00 AM Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-backup:
    name: Exportar pg_dump, Cifrar AES-256-GCM y Verificar Restauración
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validar secretos requeridos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta configurar el secreto SUPABASE_DB_URL en GitHub (Settings -> Secrets and variables -> Actions). Usá la cadena del Session Pooler de Supabase (IPv4 compatible)."
            exit 1
          fi
          if [ -z "$BACKUP_ENCRYPTION_KEY" ] || [ ${#BACKUP_ENCRYPTION_KEY} -lt 16 ]; then
            echo "::error::Falta configurar el secreto BACKUP_ENCRYPTION_KEY (mínimo 16 caracteres) en GitHub Actions Secrets."
            exit 1
          fi

      - name: Instalar PostgreSQL 17 client (PGDG oficial)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump PostgreSQL y cifrado autenticado AES-256-GCM + verificación
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          RAW_FILE="backups/zyven-db-${TIMESTAMP}.sql"
          ENC_FILE="backups/zyven-db-${TIMESTAMP}.sql.enc"

          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-acl \
            --schema=public \
            --file="$RAW_FILE"

          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const rawPath = process.argv[1];
            const encPath = process.argv[2];
            const passphrase = process.env.BACKUP_ENCRYPTION_KEY;

            const plaintext = fs.readFileSync(rawPath);
            const magic = Buffer.from("ZYVENBKP1", "ascii");
            const salt = crypto.randomBytes(16);
            const iv = crypto.randomBytes(12);
            const key = crypto.pbkdf2Sync(passphrase, salt, 120000, 32, "sha256");

            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
            const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
            const authTag = cipher.getAuthTag();
            const envelope = Buffer.concat([magic, salt, iv, authTag, ciphertext]);
            fs.writeFileSync(encPath, envelope);

            // Verificación inmediata de descifrado e integridad SHA-256
            const readBack = fs.readFileSync(encPath);
            const rSalt = readBack.subarray(9, 25);
            const rIv = readBack.subarray(25, 37);
            const rTag = readBack.subarray(37, 53);
            const rCipher = readBack.subarray(53);
            const rKey = crypto.pbkdf2Sync(passphrase, rSalt, 120000, 32, "sha256");
            const decipher = crypto.createDecipheriv("aes-256-gcm", rKey, rIv);
            decipher.setAuthTag(rTag);
            const decrypted = Buffer.concat([decipher.update(rCipher), decipher.final()]);

            const origHash = crypto.createHash("sha256").update(plaintext).digest("hex");
            const decHash = crypto.createHash("sha256").update(decrypted).digest("hex");
            if (origHash !== decHash) {
              throw new Error("Fallo de verificación SHA-256 tras descifrar el backup.");
            }
            console.log("Backup cifrado y verificado OK. SHA-256:", origHash, "Bytes:", envelope.byteLength);
          ' "$RAW_FILE" "$ENC_FILE"

          rm -f "$RAW_FILE"

      - name: Subir artefacto cifrado privado (Retención 30 días)
        uses: actions/upload-artifact@v4
        with:
          name: zyven-encrypted-db-backup-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 30
          if-no-files-found: error
